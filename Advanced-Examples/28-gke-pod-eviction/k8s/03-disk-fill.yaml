# ノードのディスクを埋めて DiskPressure を起こす。
# emptyDir は nodefs 上にあるので、ここへの書き込みが nodefs.available を削る。
apiVersion: v1
kind: Pod
metadata: {name: diskfill, namespace: evict-test}
spec:
  terminationGracePeriodSeconds: 5
  containers:
  - name: fill
    image: busybox:1.36
    command: ["sh","-c","dd if=/dev/zero of=/data/big bs=1M count=20000 2>&1 | tail -1; echo filled; sleep 900"]
    volumeMounts: [{name: d, mountPath: /data}]
  volumes:
  - name: d
    emptyDir: {}
