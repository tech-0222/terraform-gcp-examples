[defaults]
# Roles live at the project root, but the playbook is under playbooks/.
# Ansible resolves roles relative to the playbook's own directory, so without
# this it looks in playbooks/roles/ and reports "the role 'common' was not
# found" -- with terraform apply already reported as successful.
roles_path = ./roles

host_key_checking = False
stdout_callback = default
# Show which tasks changed something. Idempotence is one of the things this
# example measures, and the recap is the evidence.
display_skipped_hosts = False
retry_files_enabled = False
