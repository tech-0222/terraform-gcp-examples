# Applied manually from the bastion (see nginx-deployment.yaml for why).
#
# A server Pod plus a NetworkPolicy that allows ingress on port 8080 only
# from Pods labeled role=netpol-allowed. Verification (see README) runs
# two ad-hoc client Pods against this Service: one carrying the allowed
# label (expected to succeed) and one without it (expected to be
# rejected by Dataplane V2's NetworkPolicy enforcement, not merely slow).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netpol-server
  namespace: default
  labels:
    app: netpol-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netpol-server
  template:
    metadata:
      labels:
        app: netpol-server
    spec:
      containers:
        - name: netpol-server
          image: hashicorp/http-echo:0.2.3
          args:
            - "-listen=:8080"
            - "-text=authorized-reached"
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"
---
apiVersion: v1
kind: Service
metadata:
  name: netpol-server
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: netpol-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-server-allow-labeled-only
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: netpol-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: netpol-allowed
      ports:
        - protocol: TCP
          port: 8080
