# Applied manually from the bastion (the cluster has no path reachable by
# Terraform's kubernetes provider). Stays running so the same Pod can be
# used for both the Step 1 (failure) and Step 2 (success) curl checks.
apiVersion: v1
kind: Pod
metadata:
  name: curlpod
  namespace: default
  labels:
    app: curlpod
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.5.0
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          memory: "16Mi"
          cpu: "10m"
        limits:
          memory: "32Mi"
          cpu: "50m"
  restartPolicy: Never
