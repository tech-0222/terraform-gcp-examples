apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: node-exporter
  endpoints:
    - port: 9100
      interval: 30s
      metricRelabeling:
        - action: drop
          sourceLabels: ["__name__"]
          regex: "node_textfile_scrape_error"
