# Tells the Secret Manager CSI driver which secret to fetch and what
# filename to expose it as inside the mounted volume.
#
# __PROJECT_ID__ and __SECRET_ID__ are replaced with terraform output values
# before apply (see README) -- the file is committed with placeholders so no
# project-specific value lands in the repository.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gcp-sm-demo
  namespace: default
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/__PROJECT_ID__/secrets/__SECRET_ID__/versions/latest"
        path: "db-password.txt"
