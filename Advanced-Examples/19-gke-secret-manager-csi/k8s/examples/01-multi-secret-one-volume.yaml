# Pattern: one SecretProviderClass exposing several secrets in the same
# volume, each as its own file. Placeholders are replaced before apply
# (see README).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gcp-sm-multi
  namespace: default
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/__PROJECT_ID__/secrets/__SECRET_ID__/versions/latest"
        path: "db-password.txt"
      - resourceName: "projects/__PROJECT_ID__/secrets/__SECRET_ID_2__/versions/latest"
        path: "api-key.txt"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-multi-secret
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-multi-secret
  template:
    metadata:
      labels:
        app: app-multi-secret
    spec:
      serviceAccountName: app-ksa
      containers:
        - name: app
          image: nginx:1.25-alpine
          volumeMounts:
            - name: secret-vol
              mountPath: /var/secrets
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: secret-vol
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: gcp-sm-multi
