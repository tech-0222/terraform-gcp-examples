# Pattern: pinning an explicit version instead of "latest". A pinned mount
# keeps serving that version even after newer ones are added -- useful when
# a rollout must not pick up a rotated value implicitly.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gcp-sm-pinned
  namespace: default
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/__PROJECT_ID__/secrets/__SECRET_ID__/versions/1"
        path: "db-password-v1.txt"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-pinned-secret
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-pinned-secret
  template:
    metadata:
      labels:
        app: app-pinned-secret
    spec:
      serviceAccountName: app-ksa
      containers:
        - name: app
          image: nginx:1.25-alpine
          volumeMounts:
            - name: secret-vol
              mountPath: /var/secrets
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: secret-vol
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: gcp-sm-pinned
