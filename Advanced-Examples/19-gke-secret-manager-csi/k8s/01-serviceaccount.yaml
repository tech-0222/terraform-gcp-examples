# The Kubernetes ServiceAccount named directly as an IAM principal in
# secret.tf. Its namespace and name are baked into that principal string,
# so they must match var.k8s_namespace / var.k8s_service_account_name.
#
# Note there is no iam.gke.io/gcp-service-account annotation: with Workload
# Identity Federation the KSA holds the IAM binding itself, so no Google
# Service Account is created or impersonated.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-ksa
  namespace: default
