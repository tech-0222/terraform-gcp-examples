# Adds a preStop hook to k8s/04-nginx-ha.yaml.
#
# Eviction and Service endpoint removal are not synchronised. kubelet sends
# SIGTERM as soon as the Pod is marked for deletion, while kube-proxy on the
# other nodes is still updating its rules -- so requests keep arriving at a
# container that has already shut down. nginx does a fast shutdown on SIGTERM,
# so those requests fail outright.
#
# The preStop sleep keeps the container serving while that propagation
# finishes. terminationGracePeriodSeconds must be longer than the sleep, or
# the kubelet kills the container before the hook returns.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-cmek
  namespace: default
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: nginx-cmek
  template:
    metadata:
      labels:
        app: nginx-cmek
    spec:
      terminationGracePeriodSeconds: 40
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: nginx-cmek
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: nginx:1.25.3
          ports:
            - containerPort: 80
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "20"]
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginx-cmek
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: nginx-cmek
