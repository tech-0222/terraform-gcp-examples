# Baseline: no sidecar. GKE's own logging agent picks up container stdout.
#
# Three shapes are emitted so the agent's own handling is visible:
#   - a plain text line
#   - a JSON line
#   - a JSON line carrying a "severity" key
#
# What ends up in textPayload vs jsonPayload, and whether severity is honoured,
# is decided here -- before any Fluentd is involved.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plain-stdout
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plain-stdout
  template:
    metadata:
      labels:
        app: plain-stdout
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "PLAIN this is an ordinary line"
                echo '{"msg":"JSON without severity","order_id":1234}'
                echo '{"severity":"ERROR","msg":"JSON with severity","order_id":1235}'
                sleep 20
              done
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
