minimum_pre_commit_version: "3.2.0"
repos:
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: Detect secrets in staged changes
        entry: bash scripts/security/secret-scan.sh staged
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # 導入時点で0件（実測）。既存は落ちず、これから書くものだけが落ちる。
      - id: lint-sources
        name: Lint shell scripts and GitHub Actions
        entry: bash scripts/lint_sources.sh all
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # 追跡下の .tf だけを見る。gitignore した各自の tfvars では落ちない。
      - id: terraform-lint
        name: Check Terraform formatting and lint
        entry: bash scripts/lint_terraform.sh all
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # .agents と .claude に同じ skill を二重に置いている。片方だけ直すと
      # 黙ってズレる。差分は allowed-tools 行だけ、という前提を固定する。
      - id: skill-sync
        name: Check .agents mirrors .claude
        entry: bash scripts/check_skill_sync.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: gitleaks-pre-push
        name: Detect secrets in commits to push
        entry: bash scripts/security/secret-scan.sh push
        language: system
        pass_filenames: false
        stages: [pre-push]
