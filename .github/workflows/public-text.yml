name: Check public text

# PR や Issue の本文は GitHub が公開する。コードは Gitleaks、コミット
# メッセージは commit-msg フックで見ているのに、ここだけ無検査だった。
#
# **ローカルのフックでは止められない。** `gh pr create` はフックを通らず、
# Web UI からも書ける。だから経路によらず必ず通る CI で落とす。
#
# edited を含めるのが要点。あとから本文を書き換えて混入する経路を塞ぐ。
on:
  pull_request:
    types: [opened, edited, reopened]
  issues:
    types: [opened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 本文は信頼できない入力。`${{ }}` でシェルに直接展開すると
      # コマンド注入になる。環境変数で渡して、シェルには触らせない。
      - name: Scan the pull request body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" \
            | python3 scripts/check_public_text.py --stdin --label "PR本文とタイトル"

      - name: Scan the issue body
        if: github.event_name == 'issues'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s\n%s\n' "$ISSUE_TITLE" "$ISSUE_BODY" \
            | python3 scripts/check_public_text.py --stdin --label "Issue本文とタイトル"
