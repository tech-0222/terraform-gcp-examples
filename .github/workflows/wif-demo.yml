name: wif-demo

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  gcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/YOUR_PROJECT_NUMBER/locations/global/workloadIdentityPools/tf-adv-github-pool/providers/tf-adv-github-provider"
          service_account: "tf-adv-github-actions@YOUR_PROJECT_ID.iam.gserviceaccount.com"

      - uses: google-github-actions/setup-gcloud@v2

      - name: Read demo object
        run: gcloud storage cat "gs://tf-adv-wif-demo-YOUR_PROJECT_ID/hello-wif.txt"
